<style id="dj-sniper-mobile-fix">
html,body{
  width:100%;
  max-width:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
}
body{
  min-width:0;
}
#dj-complete{
  width:100vw;
  max-width:100vw;
  min-width:0;
  overflow:hidden;
}
.dj-main{
  width:100%;
  min-width:0;
  overflow:hidden;
}
.dj-content{
  min-width:0 !important;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}
.dj-page{
  width:100%;
  max-width:1000px;
  min-width:0;
}
.dj-card,.dj-grid,.dj-row{
  min-width:0;
  max-width:100%;
}
.dj-input,.dj-select,.dj-text{
  min-width:0;
  max-width:100%;
  box-sizing:border-box;
}
.dj-chips{
  max-width:100%;
  overflow:visible;
}
.dj-top{
  min-width:0;
  width:100%;
  box-sizing:border-box;
}
.dj-brand{
  flex:0 0 auto;
  white-space:nowrap;
}
.dj-top small{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.dj-spacer{
  min-width:8px;
}
.dj-credit{
  flex:0 0 auto;
  white-space:nowrap;
}
@media (max-width:760px){
  #dj-complete{
    width:100%;
    max-width:100%;
  }
  .dj-top{
    height:58px;
    gap:8px;
    padding:0 10px;
  }
  .dj-brand{
    font-size:16px;
    letter-spacing:.02em;
  }
  .dj-top small{
    font-size:11px;
    flex:1 1 auto;
  }
  .dj-credit{
    font-size:10px;
    padding:6px 8px;
  }
  .dj-content{
    padding:14px !important;
    width:100%;
    max-width:100%;
  }
  .dj-page{
    width:100%;
    max-width:100%;
  }
  .dj-title{
    font-size:25px;
    line-height:1.15;
  }
  .dj-sub{
    font-size:13px;
    line-height:1.45;
    overflow-wrap:anywhere;
  }
  .dj-grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) !important;
    width:100%;
  }
  .dj-row{
    grid-template-columns:minmax(0,1fr) !important;
    width:100%;
  }
  .dj-card{
    width:100%;
    max-width:100%;
    padding:14px;
    box-sizing:border-box;
  }
  .dj-input,.dj-select,.dj-text{
    width:100% !important;
    max-width:100% !important;
    font-size:16px; /* prevents Android WebView input zoom */
  }
  .dj-text{
    min-height:130px;
  }
  .dj-chip{
    max-width:100%;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .dj-hero h1{
    font-size:28px;
    line-height:1.12;
    overflow-wrap:anywhere;
  }
  .dj-hero{
    padding:18px;
    width:100%;
    max-width:100%;
  }
  .dj-btn{
    width:100%;
    max-width:100%;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .dj-track{
    flex-wrap:wrap;
    width:100%;
    max-width:100%;
  }
  .dj-wave{
    min-width:80px;
  }
}
</style>

/*
 DJ SNIPER AI - AI generation bridge
 The current UI uses the existing local Web Audio preview engine.
 To enable real AI generation, set API_BASE_URL and implement /api/generate.
 Keep provider/API keys on a server; never place secret keys in this HTML.
*/
window.DJ_SNIPER_AI = {
  API_BASE_URL: "",
  async generateSong(payload) {
    const base = (this.API_BASE_URL || "").replace(/\/$/, "");
    const r = await fetch((base || "") + "/api/generate", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ("Generation request failed: " + r.status));

<style id="dj-sniper-complete-css">
#dj-complete{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;position:fixed;inset:0;z-index:99999;background:#07070a;color:#fff;display:flex;flex-direction:column}
#dj-complete *{box-sizing:border-box}
.dj-top{height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #24242b;background:#0c0c10}
.dj-brand{font-weight:900;letter-spacing:.04em;font-size:18px}.dj-brand b{color:#a855f7}
.dj-top small{color:#858593}.dj-spacer{flex:1}
.dj-credit{padding:7px 11px;border:1px solid #30303a;border-radius:999px;background:#15151b;color:#ddd;font-size:12px}
.dj-main{display:flex;flex:1;min-height:0}
.dj-side{width:220px;padding:14px;border-right:1px solid #24242b;background:#0a0a0d}
.dj-nav{width:100%;padding:11px 12px;margin:3px 0;border:0;border-radius:11px;background:transparent;color:#aaa;text-align:left;font-size:14px;cursor:pointer}
.dj-nav:hover,.dj-nav.active{background:#19141f;color:#fff}.dj-nav.active{box-shadow:inset 3px 0 #a855f7}
.dj-content{flex:1;overflow:auto;padding:28px}
.dj-page{max-width:1000px;margin:auto}
.dj-title{font-size:30px;font-weight:900;margin:0 0 6px}.dj-sub{color:#90909c;margin:0 0 22px}
.dj-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
.dj-card{background:#101015;border:1px solid #292933;border-radius:17px;padding:18px;margin-bottom:16px}
.dj-label{font-size:11px;color:#aaa;letter-spacing:.08em;font-weight:800;margin:0 0 7px}
.dj-input,.dj-select,.dj-text{width:100%;background:#18181f;border:1px solid #30303a;border-radius:11px;color:#fff;padding:12px;outline:none}
.dj-text{min-height:150px;resize:vertical}.dj-input:focus,.dj-select:focus,.dj-text:focus{border-color:#8b5cf6}
.dj-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dj-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.dj-chip{border:1px solid #30303a;background:#15151b;color:#bbb;padding:7px 10px;border-radius:999px;cursor:pointer;font-size:12px}
.dj-chip.on{border-color:#8b5cf6;background:#291641;color:#fff}
.dj-btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer;color:#fff}
.dj-primary{background:linear-gradient(135deg,#7c3aed,#a855f7);width:100%;margin-top:14px}.dj-secondary{background:#19191f;border:1px solid #30303a}
.dj-hero{padding:24px;border-radius:20px;background:radial-gradient(circle at 80% 20%,#42206d,#101015 52%);border:1px solid #30223d;margin-bottom:18px}
.dj-hero h1{font-size:34px;margin:0 0 8px}.dj-hero p{color:#c7bfd0}
.dj-stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #24242b;color:#bbb}
.dj-track{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #292933;border-radius:13px;background:#111116;margin:8px 0}
.dj-play{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#000;cursor:pointer;font-weight:900}
.dj-wave{height:32px;flex:1;background:repeating-linear-gradient(90deg,#7c3aed 0 3px,transparent 3px 8px);opacity:.7;border-radius:5px}
.dj-modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
.dj-modal.open{display:flex}.dj-modalbox{width:min(500px,100%);background:#111116;border:1px solid #34343d;border-radius:18px;padding:20px}
.dj-x{float:right;background:none;border:0;color:#aaa;font-size:20px;cursor:pointer}
.dj-toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#19191f;border:1px solid #363640;border-radius:999px;padding:10px 15px;display:none;z-index:100001}
@media(max-width:760px){.dj-side{display:none}.dj-content{padding:16px}.dj-grid{grid-template-columns:1fr}.dj-row{grid-template-columns:1fr}.dj-title{font-size:25px}.dj-top{padding:0 12px}}
</style>

<div id="dj-complete">
<header class="dj-top">
  <div class="dj-brand">DJ <b>SNIPER</b> AI</div><small>Turn Your Words Into Music</small>
  <div class="dj-spacer"></div><div class="dj-credit">⚡ <span id="djCredits">50</span> credits</div>
</header>
<div class="dj-main">
<aside class="dj-side">
  <button class="dj-nav active" data-page="home">🏠 Home</button>
  <button class="dj-nav" data-page="create">🎵 Create Music</button>
  <button class="dj-nav" data-page="lyrics">✍️ AI Lyrics</button>
  <button class="dj-nav" data-page="library">🎧 My Library</button>
  <button class="dj-nav" data-page="explore">🔥 Explore</button>
  <button class="dj-nav" data-page="profile">👤 Profile</button>
</aside>
<main class="dj-content"><div id="djPage"></div></main>
</div>
</div>
<div id="djModal" class="dj-modal"><div class="dj-modalbox"><button class="dj-x" id="djClose">✕</button><h2>DJ SNIPER AI</h2><p id="djModalText"></p></div></div>
<div id="djToast" class="dj-toast"></div>

<script>
window.DJ_SNIPER_AI = window.DJ_SNIPER_AI || {
 API_BASE_URL:"",
 async generateSong(payload){
   const base=(this.API_BASE_URL||"").replace(/\/$/,"");
   const r=await fetch((base||"")+"/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
   const data=await r.json().catch(()=>({}));
   if(!r.ok) throw new Error(data.error||("Generation request failed: "+r.status));
   return data;
 }
};
</script>

<script id="dj-sniper-complete-app">
(function(){
 const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
 let state={page:"home",credits:Number(localStorage.getItem("djCredits")||50),tracks:JSON.parse(localStorage.getItem("djTracks")||"[]"),
 title:"",lyrics:"",style:"Marathi Folk, Dhol Tasha, powerful festival energy",language:"Marathi",vocal:"Male",mode:"Vocals",bpm:128};
 const save=()=>{localStorage.setItem("djCredits",state.credits);localStorage.setItem("djTracks",JSON.stringify(state.tracks));$("#djCredits").textContent=state.credits};
 function toast(x){let t=$("#djToast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
 function modal(x){$("#djModalText").textContent=x;$("#djModal").classList.add("open")}
 $("#djClose").onclick=()=>$("#djModal").classList.remove("open");
 function nav(){ $$(".dj-nav").forEach(b=>{b.classList.toggle("active",b.dataset.page===state.page);b.onclick=()=>{state.page=b.dataset.page;render()}})}
 function trackHtml(t,i){return `<div class="dj-track"><button class="dj-play" onclick="DJ.play(${i})">▶</button><div style="min-width:150px"><b>${esc(t.title)}</b><div style="color:#888;font-size:12px">${esc(t.language)} • ${esc(t.style)}</div></div><div class="dj-wave"></div><button class="dj-btn dj-secondary" onclick="DJ.download(${i})">⬇</button><button class="dj-btn dj-secondary" onclick="DJ.share(${i})">↗</button></div>`}
 function esc(x){return String(x||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
 function render(){
  nav();let p=$("#djPage");
  if(state.page==="home")p.innerHTML=`<div class="dj-hero"><h1>Make Music With <span style="color:#a855f7">DJ SNIPER AI</span> 🔥</h1><p>Create original songs from your words, lyrics and musical ideas.</p><button class="dj-btn dj-primary" onclick="DJ.go('create')">🎵 Create Your Song</button></div><div class="dj-grid"><div class="dj-card"><h2>Quick Create</h2><p class="dj-sub">Choose a style and start generating.</p><div class="dj-chips">${["Marathi Folk","Tamil Kuthu","DJ Trance","Bollywood","Rap","Koli Folk","Devotional","EDM"].map(x=>`<button class="dj-chip" onclick="DJ.quick('${x}')">${x}</button>`).join("")}</div></div><div class="dj-card"><h2>Account</h2><div class="dj-stat"><span>Credits</span><b>${state.credits}</b></div><div class="dj-stat"><span>Saved tracks</span><b>${state.tracks.length}</b></div></div></div>`;
  else if(state.page==="create")p.innerHTML=`<h1 class="dj-title">Create Music</h1><p class="dj-sub">Describe the song. DJ SNIPER AI handles the rest.</p><div class="dj-grid"><section class="dj-card"><div class="dj-label">SONG TITLE</div><input id="djTitle" class="dj-input" value="${esc(state.title)}" placeholder="My New Song"><div class="dj-row" style="margin-top:14px"><div><div class="dj-label">LANGUAGE</div><select id="djLang" class="dj-select"><option>Marathi</option><option>Hindi</option><option>Tamil</option><option>Gujarati</option><option>English</option><option>Sanskrit</option><option>Telugu</option><option>Kannada</option></select></div><div><div class="dj-label">VOCAL</div><select id="djVocal" class="dj-select"><option>Male</option><option>Female</option><option>Duet</option><option>Instrumental</option></select></div></div><div style="margin-top:14px"><div class="dj-label">MUSIC STYLE / PROMPT</div><textarea id="djStyle" class="dj-text">${esc(state.style)}</textarea><div class="dj-chips">${["Dhol Tasha","Koli Folk","Tamil Kuthu","DJ Trance","80s Retro","Gangster","Romantic","Festival Anthem","Orchestral","Lo-fi"].map(x=>`<button class="dj-chip" onclick="DJ.addStyle('${x}')">${x}</button>`).join("")}</div></div><div style="margin-top:14px"><div class="dj-label">LYRICS</div><textarea id="djLyrics" class="dj-text" placeholder="[Verse]\nWrite your lyrics here...\n\n[Chorus]\nYour hook here">${esc(state.lyrics)}</textarea></div><button id="djGenerate" class="dj-btn dj-primary">⚡ GENERATE SONG</button></section><aside class="dj-card"><h2>Generation Settings</h2><div class="dj-stat"><span>Versions</span><b>2</b></div><div class="dj-stat"><span>Tempo</span><b>${state.bpm} BPM</b></div><div class="dj-stat"><span>Output</span><b>Audio + Cover</b></div><p style="color:#888;font-size:12px;margin-top:15px">Real AI mode becomes active when a compatible music-generation backend is configured. Until then this app clearly stays in preview mode.</p></aside></div>`;
  else if(state.page==="lyrics")p.innerHTML=`<h1 class="dj-title">AI Lyrics ✍️</h1><p class="dj-sub">Create a structured lyric draft from a theme.</p><div class="dj-card"><input id="lyTheme" class="dj-input" placeholder="Theme: Mumbai festival, love, motivation..."><div class="dj-row" style="margin-top:12px"><select id="lyLang" class="dj-select"><option>Marathi</option><option>Hindi</option><option>Tamil</option><option>English</option></select><select id="lyMood" class="dj-select"><option>Powerful</option><option>Romantic</option><option>Celebration</option><option>Emotional</option></select></div><button class="dj-btn dj-primary" onclick="DJ.lyrics()">✨ Generate Lyrics Draft</button><textarea id="lyOut" class="dj-text" style="margin-top:14px" placeholder="Your generated draft appears here..."></textarea></div>`;
  else if(state.page==="library")p.innerHTML=`<h1 class="dj-title">My Library</h1><p class="dj-sub">${state.tracks.length} saved track(s)</p>${state.tracks.length?state.tracks.map(trackHtml).join(""):`<div class="dj-card">No songs yet. Create your first track 🔥</div>`}`;
  else if(state.page==="explore")p.innerHTML=`<h1 class="dj-title">Explore 🔥</h1><p class="dj-sub">Discover styles and start a new creation.</p><div class="dj-card"><h2>DJ SNIPER Styles</h2><div class="dj-chips">${["Marathi Folk","Koli Brass Band","Tamil Kuthu + DJ","Trance + Traditional Drum","80s Marathi Rap","Festival Anthem","Gangster Entry","Bollywood Fusion"].map(x=>`<button class="dj-chip" onclick="DJ.quick('${x}')">${x}</button>`).join("")}</div></div>`;
  else p.innerHTML=`<h1 class="dj-title">Profile 👤</h1><div class="dj-card"><h2>DJ SNIPER AI User</h2><div class="dj-stat"><span>Credits</span><b>${state.credits}</b></div><div class="dj-stat"><span>Library</span><b>${state.tracks.length} tracks</b></div><button class="dj-btn dj-primary" onclick="modal('Login / Signup backend is ready for integration. Connect authentication and database to make accounts persistent.')">Login / Signup</button></div>`;
  if(state.page==="create") $("#djGenerate").onclick=generate;
 }
 function readForm(){state.title=$("#djTitle").value;state.language=$("#djLang").value;state.vocal=$("#djVocal").value;state.style=$("#djStyle").value;state.lyrics=$("#djLyrics").value}
 async function generate(){
  readForm(); if(!state.title.trim()){toast("Song title required");return}
  if(state.credits<1){toast("No credits left");return}
  state.credits--;save();$("#djGenerate").disabled=true;$("#djGenerate").textContent="⏳ Generating...";
  try{
   let result=await window.DJ_SNIPER_AI.generateSong({title:state.title,lyrics:state.lyrics,style:state.style,language:state.language,vocal:state.vocal,mode:state.vocal==="Instrumental"?"instrumental":"vocals",versions:2,bpm:state.bpm});
   let t={id:Date.now(),title:state.title,lyrics:state.lyrics,style:state.style,language:state.language,vocal:state.vocal,audioUrl:result&&result.audioUrl||"",createdAt:new Date().toLocaleString()};
   state.tracks.unshift(t);save();state.page="library";render();
   modal(result&&result.mode==="preview"?"Preview track created. Connect DJ_SNIPER_AI.API_BASE_URL to your real AI backend for actual AI audio.":"AI generation completed.");
  }catch(e){state.credits++;save();toast("Generation failed: "+e.message)}
  finally{if($("#djGenerate")){$("#djGenerate").disabled=false;$("#djGenerate").textContent="⚡ GENERATE SONG"}}
 }
 window.DJ={go:x=>{state.page=x;render()},quick:x=>{state.style=x;state.page="create";render();setTimeout(()=>{$("#djStyle").value=x+", powerful modern production";},0)},addStyle:x=>{$("#djStyle").value+=($("#djStyle").value?", ":"")+x},lyrics:()=>{let theme=$("#lyTheme").value||"celebration";$("#lyOut").value=`[Intro]\n${theme} begins tonight...\n\n[Verse]\nWe rise with the rhythm, lights in the sky,\nDreams in our hearts and the beat running high.\n\n[Chorus]\n${theme} — sing it loud, feel it tonight!\nDJ SNIPER AI — turn the moment to life!\n\n[Verse 2]\nHands in the air, let the music flow,\nOne powerful hook and the whole crowd goes!\n`;},play:i=>{let t=state.tracks[i];if(!t)return;if(t.audioUrl){new Audio(t.audioUrl).play().catch(()=>toast("Tap play again to allow audio"))}else toast("Preview track: connect real AI audio backend for playback.")},download:i=>{let t=state.tracks[i];if(t&&t.audioUrl){let a=document.createElement("a");a.href=t.audioUrl;a.download=(t.title||"dj-sniper-song")+".mp3";a.click()}else modal("No real audio file is attached in preview mode. Configure the AI backend first.")},share:i=>{let t=state.tracks[i];navigator.share?navigator.share({title:t.title,text:"Created with DJ SNIPER AI"}):toast("Share link can be added after backend storage is connected.")}};
 render();save();
})();
</script>

</body>
</html>
